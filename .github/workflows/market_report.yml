name: Market Report Generator

on:
  workflow_dispatch: # Manual trigger via the "Run workflow" button
  # schedule:
  #   - cron: '0 21 * * 1-5' # Optional: Auto-run after market close (Mon-Fri)

# Sets permissions of the GITHUB_TOKEN to allow repository writes and GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment to GitHub Pages
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so git rebase and push work reliably
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up runs by caching yfinance and pandas builds

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pytz

      - name: Run Market Report Generator
        run: python report.py

      - name: Commit and Push Updated Snapshot & HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html last_run_snapshot.json
          
          # Check if there are changes before committing
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-update market report [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes detected. Skipping commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads repository root containing index.html

  deploy-site:
    needs: build-and-report
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
