name: Market Report

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pytz

      - name: Run Report Generator
        env:
          TZ: "America/Denver"
        run: python report.py

      - name: Commit and push updated report & snapshots
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html last_run_snapshot.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market report [skip ci]" && git push)
